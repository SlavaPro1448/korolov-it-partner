# Проект генерируется: `xcodegen generate` (brew install xcodegen). Секреты — Secrets.xcconfig (не в git).
name: Dolmetscher
options:
  bundleIdPrefix: Viacheslav
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: U372KNPSFL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    exactVersion: 6.13.8
targets:
  Dolmetscher:
    type: application
    platform: iOS
    sources:
      - path: Dolmetscher
    dependencies:
      - package: TwilioVoice
        product: TwilioVoice
    info:
      path: Dolmetscher/Info.plist
      properties:
        CFBundleDisplayName: Переводчик
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Чтобы звонить через интернет прямо из приложения. Звук идёт только в разговор и не записывается.
        UIBackgroundModes: [audio, voip]
        NSUserActivityTypes: [INStartCallIntent]
        NSContactsUsageDescription: Чтобы выбирать номер из ваших контактов и показывать имена в истории звонков. Контакты никуда не отправляются.
        DolmetscherURL: $(DOLMETSCHER_URL)
        DolmetscherKey: $(DOLMETSCHER_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Viacheslav.Dolmetscher
        CODE_SIGN_ENTITLEMENTS: Dolmetscher/Dolmetscher.entitlements
        # Свой профиль с пуш-уведомлениями (создан в Apple Developer 16.10.2026, «Dolmetscher Dev»)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Dolmetscher Dev
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        GENERATE_INFOPLIST_FILE: false
