# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: public

jobs:
# Please do not rename this job
  build-project:
    name: build korolov-it-partner
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v20.x

      - name: Build Node assets
        env:
          CI: true
          MAIL_FROM: info@korolov-it-service.de
          MAIL_SUBJECT: Neue Anfrage über die Website
          MAIL_TO: info@korolov-it-service.de
          SITE_URL: ${{ inputs.site-url }}
          SMTP_HOST: smtp.ionos.de
          SMTP_PASS: hepmym-jupcaS-5dygno
          SMTP_PORT: 465
          SMTP_USER: info@korolov-it-service.de
        run: |
          npm ci
          npm install
          npm run build

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: a15e26d1-7d3b-48e9-9c29-e2f74a19f246
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/korolov-it-partner/config.yaml
          action: upload
